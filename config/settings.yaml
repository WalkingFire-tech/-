# 联盟拓荒者配置文件

# Embedding配置
embedding:
  model: "paraphrase-multilingual-MiniLM-L12-v2"
  offline_mode: true
  fallback_to_hash: true

# 模型配置
models:
  # 本地模型配置
  local:
    ollama_base_url: "http://localhost:11434"
    default_timeout: null  # 不限制超时，让模型充分思考
    retry_times: 0         # 不重试，失败就失败
    retry_delay: 1
    
    # 可用的本地模型列表
    available:
      qwen2.5-coder:7b:
        enabled: true
        description: "代码生成模型(7B)"
        temperature: 0.7
        max_tokens: 4096
      deepcoder:
        enabled: true
        description: "深度代码模型"
        temperature: 0.3
        max_tokens: 2048

  # 远程模型配置
  remote:
    enabled: true
    timeout: 30
    retry_times: 1
    retry_delay: 2
    models:
      gpt-4o-mini:
        description: "GPT-4o mini"
        temperature: 0.7
        max_tokens: 2048
        base_url: null  # 使用OpenAI默认URL
      deepseek-chat:
        description: "DeepSeek Chat - 通用对话模型"
        temperature: 0.7
        max_tokens: 4096
        base_url: "https://api.deepseek.com/v1"
      deepseek-coder:
        description: "DeepSeek Coder - 代码专用模型"
        temperature: 0.3
        max_tokens: 4096
        base_url: "https://api.deepseek.com/v1"

# 模型路由策略
routing:
  # 任务类型到模型的映射(与实际注册模型名称一致)
  task_model_mapping:
    code:
      preferred: ["qwen2.5-coder:7b", "deepcoder"]
      fallback: "qwen2.5-coder:7b"
    chat:
      preferred: ["qwen2.5-coder:7b", "deepcoder"]
      fallback: "qwen2.5-coder:7b"
    question:
      preferred: ["qwen2.5-coder:7b", "deepcoder"]
      fallback: "qwen2.5-coder:7b"
    calculation:
      preferred: ["qwen2.5-coder:7b", "deepcoder"]
      fallback: "qwen2.5-coder:7b"
    memory:
      preferred: ["qwen2.5-coder:7b", "deepcoder"]
      fallback: "qwen2.5-coder:7b"
    document:
      preferred: ["qwen2.5-coder:7b", "deepcoder"]
      fallback: "qwen2.5-coder:7b"
  
  # 全局fallback顺序(当特定意图无配置时使用)
  fallback:
    default_order:
      - qwen2.5-coder:7b
      - deepcoder
    # 按任务类型的fallback顺序
    task_model_order:
      code:
        - qwen2.5-coder:7b
        - deepcoder
      question:
        - qwen2.5-coder:7b
        - deepcoder
      chat:
        - qwen2.5-coder:7b
        - deepcoder
      calculation:
        - qwen2.5-coder:7b
        - deepcoder
      document:
        - qwen2.5-coder:7b
        - deepcoder
  
  # 复杂任务判定
  complex_task:
    min_text_length: 100
    keywords: ["π", "Π", "pi", "圆周率", "复杂", "详细"]
    calculation_keywords: ["计算", "输出", "数值", "前", "位"]

# 意图识别配置
intent:
  # 意图识别阈值
  confidence_threshold: 0.6
  
  # 自定义规则(正则表达式)
  custom_rules:
    code:
      - "代码"
      - "写.*代码"
      - "生成.*代码"
      - "编程"
      - "实现"
      - "算法"
      - "冒泡"
      - "快速"
      - "递归"
      - "函数"
      - "类"
      - "模块"
    question:
      - "什么是"
      - "为什么"
      - "怎么"
      - "如何"
      - "哪"
      - "谁"
      - "多少"
      - "解释"
      - "介绍"
      - "说明"
    memory:
      - "记住"
      - "忘记"
      - "回忆"
      - "之前"
      - "刚才"
      - "聊过"
      - "说过"
      - "我们.*什么"
      - "回顾.*历史"
      - "历史对话"
      - "之前的对话"
      - "历史问题"
      - "回顾对话"
    calculation:
      - "Π"
      - "π"
      - "圆周率"
      - "前\\s*\\d+\\s*位"
      - "输出.*数值"
      - "计算.*值"
      - "给出.*结果"
    feedback:
      - "^\\+1$"
      - "^-1$"
      - "点赞"
      - "踩"
      - "好评"
      - "差评"
    map:
      - "地图"
      - "标记"
      - "渲染"
      - "可视化"
      - "绘制"
      - "folium"

# 记忆系统配置
memory:
  # 短期记忆
  short_term:
    max_rounds: 5
    file_path: "campfire_log.txt"
  
  # 长期记忆(经验池)
  long_term:
    db_path: "experience_pool.db"
    max_experiences: 10000
    auto_induction: false
    induction_interval: 100

# 统计系统配置
stats:
  db_path: "model_stats.db"
  
  # 质量评估权重
  quality_weights:
    response_length: 0.3
    code_correctness: 0.4
    user_feedback: 0.3

# 安全审核配置
audit:
  enabled: true
  
  # 危险操作拦截
  dangerous_patterns:
    - "rm\\s+-rf\\s+/"
    - "drop\\s+database"
    - "format\\s+[a-z]:"
    - "chmod\\s+777"
    - "os\\.remove\\("
    - "shutil\\.rmtree\\("
  
  # 隐私信息检测
  privacy_detection: true

# 代码执行沙盒配置
sandbox:
  enabled: true
  timeout: 15
  max_output_length: 10000
  
  # 禁止的模块
  forbidden_modules:
    - "os"
    - "subprocess"
    - "shutil"
    - "sys"
    - "__import__"
    - "eval"
    - "exec"
    - "compile"

# UI配置
ui:
  type: "cli"
  
  # CLI配置
  cli:
    prompt_style: "rich"
    show_model_info: true
    show_quality_score: true

# 日志配置
logging:
  level: "INFO"
  file: "campfire.log"
  rotation: "1 day"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"

# 计算任务配置
calculation:
  # 使用通用数学计算器工具（支持自我进化）
  use_math_calculator: true
  
  # 默认精度（当工具不可用时的降级配置）
  default_precision: 100

# 并行调度配置
parallel_scheduling:
  # 是否启用并行调度
  enabled: false  # 暂时禁用，避免Ollama过载
  
  # 每个任务使用的模型数量
  top_k: 1
  
  # 最大并发数
  max_concurrent: 1
  
  # 单模型超时(秒)
  timeout_seconds: 30
  
  # 重试次数
  retry_count: 1

# 用户偏好配置
user_preferences:
  # 模式: quality(优先质量) / speed(优先速度) / cost(优先成本) / balanced(平衡)
  mode: "balanced"
  
  # 自定义权重(仅balanced模式生效)
  weights:
    quality: 0.5
    speed: 0.3
    cost: 0.2

# 循环推理配置（借鉴OpenMythos RDT架构）
recurrent:
  # 最大迭代次数
  max_iterations: 4
  
  # 收敛阈值（相似度超过此值则提前退出）
  convergence_threshold: 0.95
  
  # 质量阈值（质量超过此值则提前退出）
  quality_threshold: 0.85
  
  # LTI稳定性因子（谱半径约束，确保<1）
  stability_factor: 0.9
  
  # 启用循环推理的任务类型
  enabled_intents:
    - code
    - question
    - meta

# Feature Flags — 新功能开关，出问题时可快速回退
feature_flags:
  # P0-3: 能力创造回路（工具失败时自主执行）
  capability_creation_loop: true
  # P1-1: 存在层路径权重矩阵（sleeping切断外部API等）
  path_weight_matrix: true
  # P1-3: 意图词表从经验中自动学习
  intent_keyword_learning: true
  # P0-1: 进化岛安全协议（6步渐进注入）
  evolution_safety_protocol: true
  # P1-2: 睡眠整合学习机制（4个机制挂接）
  sleep_learning_mechanisms: true
  # P0-4: persistent_solver传入实际intent_type
  persistent_solver_intent: true
  # 自动pip install缺失依赖
  auto_pip_install: true

# ========== P0: 并行路由决策参数 ==========
routing:
  max_parallel_paths: 9
  local_first_window_seconds: 1.5
  local_quality_threshold: 75
  path_weight_skip_threshold: 0.3

# ========== P0: 闭环调度参数 ==========
orchestrator:
  confidence_threshold: 0.6
  quality_threshold: 50.0
  ollama_timeout_seconds: 30.0

# ========== P1: ReAct引擎参数 ==========
react:
  max_iterations: 3
  fitness_threshold: 60.0
  min_improvement: 3.0
  max_total_seconds: 45.0

# ========== P1: 防御层参数 ==========
defense:
  rollback_entropy_threshold: 0.7
  zscore_threshold: 2.5
  rate_spike_threshold: 3.0
  apoptosis_threshold: 10
  regeneration_cooldown_seconds: 120
  max_regeneration_attempts: 3
  isolation_cooldown_seconds: 300
  max_isolated_modules: 20

# ========== P1: 元认知超时参数 ==========
metacognitive:
  phase0_timeout_seconds: 3.0
  phase1_timeout_seconds: 5.0
  phase3_timeout_seconds: 2.0

# ========== P0: 认知主干道工具超时 ==========
cognitive_highway:
  execution_timeout_seconds: 3.0

# ========== P2: 知识管理参数 ==========
knowledge:
  fade_threshold: 0.3
  prune_threshold: 0.1
  dormant_days: 30
  long_unused_days: 60
  similarity_threshold: 0.7
  delta_threshold: 0.3

# ========== P2: 输入守卫参数 ==========
input_guard:
  memory_threshold_high: 0.85
  memory_threshold_low: 0.75
  health_threshold_high: 0.3
  health_threshold_low: 0.4