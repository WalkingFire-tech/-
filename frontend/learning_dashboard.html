<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 学习仪表盘 - 联盟拓荒者</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .stat-label {
            color: #666;
            font-weight: 500;
        }
        
        .stat-value {
            color: #333;
            font-weight: bold;
        }
        
        .stat-value.success {
            color: #28a745;
        }
        
        .stat-value.failed {
            color: #dc3545;
        }
        
        .stat-value.pending {
            color: #ffc107;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin: 5px;
        }
        
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        button.secondary {
            background: #6c757d;
        }
        
        button.danger {
            background: #dc3545;
        }
        
        button.success {
            background: #28a745;
        }
        
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 14px;
            margin: 10px 0;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.5;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .task-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .task-item {
            padding: 10px;
            border-left: 4px solid #667eea;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 4px;
        }
        
        .task-item.success {
            border-left-color: #28a745;
        }
        
        .task-item.failed {
            border-left-color: #dc3545;
        }
        
        .task-item.pending {
            border-left-color: #ffc107;
        }
        
        .task-path {
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        
        .task-status {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        .notification {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
        }
        
        .notification.warning {
            background: #fff3cd;
            border-color: #ffeeba;
        }
        
        .notification.error {
            background: #f8d7da;
            border-color: #f5c6cb;
        }
        
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 8px;
        }
        
        .badge.success {
            background: #28a745;
            color: white;
        }
        
        .badge.failed {
            background: #dc3545;
            color: white;
        }
        
        .badge.pending {
            background: #ffc107;
            color: #333;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .mode-selector {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        
        .mode-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid #e9ecef;
            background: white;
            color: #666;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .mode-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 学习仪表盘</h1>
        
        <div class="dashboard">
            <!-- 状态概览 -->
            <div class="card">
                <h2>📊 学习状态</h2>
                <div id="status-loading" class="loading">
                    <div class="spinner"></div>
                    <p>加载中...</p>
                </div>
                <div id="status-content" style="display:none;">
                    <div class="stat">
                        <span class="stat-label">学习模式</span>
                        <span class="stat-value" id="mode">smart</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">运行状态</span>
                        <span class="stat-value" id="running">运行中</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">总任务数</span>
                        <span class="stat-value" id="total-tasks">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">待处理</span>
                        <span class="stat-value pending" id="pending-tasks">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">已完成</span>
                        <span class="stat-value success" id="completed-tasks">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">失败</span>
                        <span class="stat-value failed" id="failed-tasks">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">总知识数</span>
                        <span class="stat-value" id="total-knowledge">0</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress" style="width: 0%"></div>
                    </div>
                </div>
                <button onclick="refreshStatus()">🔄 刷新状态</button>
            </div>
            
            <!-- 学习模式 -->
            <div class="card">
                <h2>⚙️ 学习模式</h2>
                <p style="color: #666; margin-bottom: 10px;">选择学习模式：</p>
                <div class="mode-selector">
                    <button class="mode-btn" onclick="setMode('auto')">自动</button>
                    <button class="mode-btn active" onclick="setMode('smart')">智能</button>
                    <button class="mode-btn" onclick="setMode('manual')">手动</button>
                </div>
                <div style="margin-top: 15px;">
                    <button onclick="pauseLearning()">⏸️ 暂停</button>
                    <button class="success" onclick="resumeLearning()">▶️ 恢复</button>
                </div>
            </div>
            
            <!-- 添加学习路径 -->
            <div class="card">
                <h2>📁 添加学习路径</h2>
                <input type="text" id="new-path" placeholder="输入文件夹路径，如：E:/my_project">
                <select id="priority">
                    <option value="high">高优先级（核心代码）</option>
                    <option value="normal" selected>普通优先级</option>
                    <option value="low">低优先级（文档）</option>
                </select>
                <button class="success" onclick="addLearningPath()">➕ 添加并学习</button>
            </div>
            
            <!-- 强制学习 -->
            <div class="card">
                <h2>🎯 强制学习</h2>
                <input type="text" id="force-path" placeholder="输入文件或文件夹路径">
                <button onclick="forceLearn()">🚀 立即学习</button>
                <p style="color: #999; font-size: 12px; margin-top: 10px;">
                    不受学习模式限制，立即学习指定文件
                </p>
            </div>
            
            <!-- 最近学习任务 -->
            <div class="card">
                <h2>📋 最近学习任务</h2>
                <div id="tasks-list" class="task-list">
                    <div class="loading">
                        <p>暂无任务</p>
                    </div>
                </div>
                <button onclick="refreshTasks()">🔄 刷新任务</button>
            </div>
            
            <!-- 知识库 -->
            <div class="card">
                <h2>📚 知识库</h2>
                <div id="knowledge-stats">
                    <div class="stat">
                        <span class="stat-label">总知识数</span>
                        <span class="stat-value" id="kb-total">0</span>
                    </div>
                </div>
                <button onclick="showKnowledge()">📖 查看知识库</button>
                <button class="secondary" onclick="showTools()">🛠️ 查看工具</button>
            </div>
        </div>
        
        <!-- 通知区域 -->
        <div class="card">
            <h2>🔔 学习通知</h2>
            <div id="notifications">
                <p style="color: #999;">暂无新通知</p>
            </div>
            <button onclick="fetchNotifications()">📬 获取通知</button>
        </div>
        
        <!-- 详细信息 -->
        <div class="card">
            <h2>📝 详细日志</h2>
            <pre id="log">等待操作...</pre>
        </div>
    </div>
    
    <div class="footer">
        <p>🤖 联盟拓荒者学习子系统 v3.1</p>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        let refreshInterval;
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            refreshStatus();
            refreshTasks();
            refreshKnowledge();
            startAutoRefresh();
        });
        
        // 自动刷新
        function startAutoRefresh() {
            refreshInterval = setInterval(() => {
                refreshStatus();
                fetchNotifications();
            }, 30000);
        }
        
        // 刷新状态
        async function refreshStatus() {
            try {
                const res = await fetch(`${API_BASE}/learning/status`);
                const data = await res.json();
                
                if (data.success) {
                    const engine = data.engine;
                    const monitor = data.monitor;
                    
                    document.getElementById('status-loading').style.display = 'none';
                    document.getElementById('status-content').style.display = 'block';
                    
                    document.getElementById('mode').textContent = engine.mode;
                    document.getElementById('running').textContent = engine.is_running ? '运行中' : '已停止';
                    document.getElementById('total-tasks').textContent = engine.total_tasks;
                    document.getElementById('pending-tasks').textContent = engine.pending_tasks;
                    document.getElementById('completed-tasks').textContent = engine.completed_tasks;
                    document.getElementById('failed-tasks').textContent = engine.failed_tasks;
                    document.getElementById('total-knowledge').textContent = engine.total_knowledge;
                    
                    // 更新进度条
                    const progress = engine.total_tasks > 0 
                        ? (engine.completed_tasks / engine.total_tasks * 100) 
                        : 0;
                    document.getElementById('progress').style.width = `${progress}%`;
                    
                    // 更新模式按钮
                    updateModeButtons(engine.mode);
                    
                    addLog('状态已更新');
                }
            } catch (error) {
                addLog('获取状态失败: ' + error.message);
            }
        }
        
        // 更新模式按钮
        function updateModeButtons(mode) {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase().includes(mode)) {
                    btn.classList.add('active');
                }
            });
        }
        
        // 设置学习模式
        async function setMode(mode) {
            try {
                const res = await fetch(`${API_BASE}/learning/mode`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({mode})
                });
                const data = await res.json();
                
                if (data.success) {
                    addLog(`学习模式已切换为: ${mode}`);
                    refreshStatus();
                } else {
                    addLog('切换模式失败: ' + data.error);
                }
            } catch (error) {
                addLog('切换模式失败: ' + error.message);
            }
        }
        
        // 添加学习路径
        async function addLearningPath() {
            const path = document.getElementById('new-path').value;
            const priority = document.getElementById('priority').value;
            
            if (!path) {
                alert('请输入文件夹路径');
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/learning/add`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({path, priority})
                });
                const data = await res.json();
                
                if (data.success) {
                    addLog(`已添加学习路径: ${path}, 任务数: ${data.tasks_added}`);
                    alert(`✅ 已添加 ${data.files_count} 个文件，创建 ${data.tasks_added} 个学习任务`);
                    refreshStatus();
                    refreshTasks();
                } else {
                    addLog('添加失败: ' + data.error);
                    alert('❌ 添加失败: ' + data.error);
                }
            } catch (error) {
                addLog('添加失败: ' + error.message);
                alert('❌ 添加失败: ' + error.message);
            }
        }
        
        // 强制学习
        async function forceLearn() {
            const path = document.getElementById('force-path').value;
            
            if (!path) {
                alert('请输入文件或文件夹路径');
                return;
            }
            
            try {
                addLog(`开始强制学习: ${path}`);
                const res = await fetch(`${API_BASE}/learning/force`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({path})
                });
                const data = await res.json();
                
                if (data.success) {
                    addLog(`强制学习成功: ${path}`);
                    alert(`✅ 学习成功，优先级: ${data.priority}`);
                    refreshStatus();
                    refreshTasks();
                } else {
                    addLog('强制学习失败: ' + (data.reason || data.error));
                    alert('❌ 学习失败: ' + (data.reason || data.error));
                }
            } catch (error) {
                addLog('强制学习失败: ' + error.message);
                alert('❌ 学习失败: ' + error.message);
            }
        }
        
        // 暂停学习
        async function pauseLearning() {
            try {
                const res = await fetch(`${API_BASE}/learning/pause`, {method: 'POST'});
                const data = await res.json();
                
                if (data.success) {
                    addLog('学习系统已暂停');
                    alert('⏸️ 学习系统已暂停');
                    refreshStatus();
                }
            } catch (error) {
                addLog('暂停失败: ' + error.message);
            }
        }
        
        // 恢复学习
        async function resumeLearning() {
            try {
                const res = await fetch(`${API_BASE}/learning/resume`, {method: 'POST'});
                const data = await res.json();
                
                if (data.success) {
                    addLog('学习系统已恢复');
                    alert('▶️ 学习系统已恢复');
                    refreshStatus();
                }
            } catch (error) {
                addLog('恢复失败: ' + error.message);
            }
        }
        
        // 刷新任务列表
        async function refreshTasks() {
            try {
                const res = await fetch(`${API_BASE}/learning/tasks?limit=10`);
                const data = await res.json();
                
                if (data.success && data.tasks.length > 0) {
                    const tasksHtml = data.tasks.map(task => {
                        const statusClass = task.status;
                        const statusIcon = {
                            'pending': '⏳',
                            'processing': '🔄',
                            'completed': '✅',
                            'failed': '❌'
                        }[task.status] || '❓';
                        
                        const fileName = task.file_path.split(/[/\\]/).pop();
                        
                        return `
                            <div class="task-item ${statusClass}">
                                <div class="task-path">${statusIcon} ${fileName}</div>
                                <div class="task-status">
                                    状态: ${task.status} | 
                                    知识数: ${task.knowledge_count || 0} |
                                    ${task.completed_at ? new Date(task.completed_at).toLocaleString() : ''}
                                </div>
                                ${task.error_msg ? `<div style="color: #dc3545; font-size: 12px;">错误: ${task.error_msg}</div>` : ''}
                            </div>
                        `;
                    }).join('');
                    
                    document.getElementById('tasks-list').innerHTML = tasksHtml;
                } else {
                    document.getElementById('tasks-list').innerHTML = '<div class="loading"><p>暂无任务</p></div>';
                }
            } catch (error) {
                addLog('获取任务失败: ' + error.message);
            }
        }
        
        // 刷新知识库
        async function refreshKnowledge() {
            try {
                const res = await fetch(`${API_BASE}/learning/knowledge?limit=1`);
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('kb-total').textContent = data.knowledge.length;
                }
            } catch (error) {
                console.error('获取知识库失败:', error);
            }
        }
        
        // 显示知识库
        async function showKnowledge() {
            try {
                const res = await fetch(`${API_BASE}/learning/knowledge?limit=50`);
                const data = await res.json();
                
                if (data.success) {
                    const knowledgeText = data.knowledge.map((item, i) => {
                        return `${i+1}. ${item.question}\n   类型: ${item.knowledge_type}, 来源: ${item.source}`;
                    }).join('\n\n');
                    
                    document.getElementById('log').textContent = `知识库 (${data.knowledge.length}条):\n\n${knowledgeText}`;
                    addLog(`显示知识库: ${data.knowledge.length}条`);
                }
            } catch (error) {
                addLog('获取知识库失败: ' + error.message);
            }
        }
        
        // 显示工具
        async function showTools() {
            try {
                const res = await fetch(`${API_BASE}/learning/tools`);
                const data = await res.json();
                
                if (data.success) {
                    if (data.tools.length === 0) {
                        document.getElementById('log').textContent = '暂无自动生成的工具';
                    } else {
                        const toolsText = data.tools.map((tool, i) => {
                            return `${i+1}. ${tool.name}\n   描述: ${tool.description}\n   使用次数: ${tool.usage_count}`;
                        }).join('\n\n');
                        
                        document.getElementById('log').textContent = `自动生成的工具 (${data.tools.length}个):\n\n${toolsText}`;
                    }
                    addLog(`显示工具: ${data.tools.length}个`);
                }
            } catch (error) {
                addLog('获取工具失败: ' + error.message);
            }
        }
        
        // 获取通知
        async function fetchNotifications() {
            try {
                const res = await fetch(`${API_BASE}/folder/status`);
                const data = await res.json();
                
                if (data.success && data.notifications && data.notifications.length > 0) {
                    const notifHtml = data.notifications.map(notif => {
                        return `
                            <div class="notification">
                                <strong>学习完成</strong><br>
                                新增: ${notif.new} | 更新: ${notif.updated} | 失败: ${notif.failed}<br>
                                时间: ${new Date(notif.timestamp).toLocaleString()}
                            </div>
                        `;
                    }).join('');
                    
                    document.getElementById('notifications').innerHTML = notifHtml;
                    addLog(`收到 ${data.notifications.length} 条通知`);
                }
            } catch (error) {
                console.error('获取通知失败:', error);
            }
        }
        
        // 添加日志
        function addLog(message) {
            const log = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            log.textContent = `[${timestamp}] ${message}\n` + log.textContent;
        }
    </script>
</body>
</html>
